{% extends "base.html" %} {% block content %}
<div class="container mt-5 bg-success-subtle rounded-3 shadow" style="max-width:600px; padding:50px;">
  <h3 class="text-center">Export Data From Database Tables</h3>
  <form
    action="{% url 'export_data' %}"
    method="POST"
    style="max-width: 600px; margin: auto; padding-top: 10px"
  >
    {% csrf_token %}
    <div class="form-group mt-3">
      <label for="model_name">Select Database table</label>
      <select name="model_name" class="form-control mt-2" required>
        <option value="" disabled selected>Select</option>
        {% for model in custom_models %}
        <option value="{{model}}">{{ model }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group p-1">
      <input type="submit" value="Export Data" class="btn btn-success mt-3" />
    </div>

    {% include "alerts.html" %}
  </form>
</div>

{% endblock %}
