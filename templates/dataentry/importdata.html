{% extends "base.html" %} {% block content %}
<div class="container mt-5 bg-primary-subtle rounded-3 shadow" style="max-width:600px; padding:50px;">
  <h3 class="text-center">Import Data to Database Tables</h3>
  <form
    action="{% url 'import_data' %}"
    method="POST"
    enctype="multipart/form-data"
    style="max-width: 600px; margin: auto; padding-top: 50px"
    class='p-3'
  >
    {% csrf_token %}
    <div class="form-group p-1">
      <label for="file_path">Upload CSV File</label>
      <input type="file" name="file_path" class="form-control mt-2" required />
    </div>
    <div class="form-group p-1 mt-2">
      <label for="model_name">Select Database table</label>
      <select name="model_name" class="form-control mt-2" required>
        <option value="" disabled selected>Select</option>
        {% for model in custom_models %}
        <option value="{{model}}">{{ model }}</option>
        {% endfor %}
      </select>
    </div>
    <div class='form-group p-1'>
      <input type="submit" value="Import Data" class="btn btn-primary mt-2" />
    </div>

    {% include "alerts.html" %}
  </form>
</div>
{% endblock %}
