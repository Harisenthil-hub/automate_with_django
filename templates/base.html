{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automate with Django</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="{% static 'js/custom.js' %}"></script>
</head>

<body>

    <nav class="navbar navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Automate with Django</a>

            {% if user.is_authenticated %}
                <div>
                    Logged in as: <b>{{ user }}</b>
                    &nbsp;<a href="{% url 'logout' %}" class="float-right btn btn-outline-danger">Logout</a>
                </div>
            {% else %}
                <div>
                    <a href="{% url "login" %}" class="float-right text-decoration-none text-dark">Login</a>
                    &nbsp;
                    <a href="{% url 'register' %}" class="float-right btn btn-success">Register</a>
                </div>
            {% endif %}
        </div>
    </nav>

    {% block content %}

    {% endblock %}

</body>
</html>
